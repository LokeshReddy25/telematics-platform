# docker-compose.yml (project root)
#
# The whole local stack from one command:
#
#     docker compose up -d --build
#
# Kafka + Zookeeper + Kafka UI come from kafka/docker-compose.yml via
# `include`, so that file still works on its own too. This file adds:
#   model-trainer  trains ml/models/risk_model.pkl if it is missing, then exits
#   kafka-init     creates the vehicle.trip.events topic, then exits
#   spark          the Structured Streaming job (devops/Dockerfile.spark)
#   simulator      the trip producer; restarts after each batch so data keeps flowing
#   influxdb       time-series sink for scored trips
#   grafana        the provisioned driver-risk dashboard (http://localhost:3000)
#   risk-api       REST API over the scores in InfluxDB (http://localhost:8001/docs)
#
# Note: this project now owns the Kafka containers. If you previously started
# kafka/docker-compose.yml on its own, stop it first
# (docker compose -f kafka/docker-compose.yml down), or the container names clash.

include:
  - kafka/docker-compose.yml

services:
  influxdb:
    image: influxdb:2.7
    container_name: telematics-influxdb
    ports:
      - "8086:8086"
    environment:
      # DOCKER_INFLUXDB_INIT_MODE=setup runs InfluxDB's first-boot wizard
      # non-interactively, creating the org/bucket/token that
      # storage/influxdb_writer.py and dashboard/grafana_config/datasource.yml
      # are already hardcoded to expect -- so no manual UI setup is needed.
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: telematics-admin-pw
      DOCKER_INFLUXDB_INIT_ORG: telematics-org
      DOCKER_INFLUXDB_INIT_BUCKET: telematics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: telematics-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - telematics-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: telematics-grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Skip Grafana's own login wall for local dev convenience; production
      # (Amazon Managed Grafana, per README) would use real auth instead.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: telematics-admin-pw
    volumes:
      # Mount the two provisioning files this project already defines
      # (Phase 8) straight into Grafana's provisioning directories, so the
      # InfluxDB datasource and the driver-risk dashboard are live the
      # moment the container starts -- no manual click-through setup.
      - ./dashboard/grafana_config/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./dashboard/grafana_config/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboard/grafana_config/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
      - grafana-data:/var/lib/grafana
    networks:
      - telematics-net

  # One-shot: trains the model into ./ml/models if risk_model.pkl is not
  # there yet (the .pkl is gitignored, so a fresh clone has none).
  model-trainer:
    build:
      context: .
      dockerfile: devops/Dockerfile.ml
    image: telematics/ml-trainer:local
    volumes:
      - ./ml/models:/app/models
    restart: "no"

  # One-shot: creates the topic before Spark subscribes to it (otherwise
  # Spark can fail with UnknownTopicOrPartitionException).
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-topics"]
    command:
      [
        "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
        "--topic", "vehicle.trip.events", "--partitions", "3", "--replication-factor", "1",
      ]
    restart: "no"
    networks:
      - telematics-net

  spark:
    build:
      context: .
      dockerfile: devops/Dockerfile.spark
    image: telematics/spark-stream-processor:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      model-trainer:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
    volumes:
      # Use the model produced by model-trainer, not whatever was baked in at build time.
      - ./ml/models:/app/ml/models:ro
      # Cache the Kafka connector jars that spark-submit --packages downloads.
      - spark-ivy:/root/.ivy2
    restart: unless-stopped
    networks:
      - telematics-net

  # Produces 5 drivers x 3 trips, exits, and is restarted, mirroring the
  # Kubernetes deployment. Spark reads from the latest offset, so events sent
  # before Spark's query has started (about the first minute) are not scored.
  simulator:
    build:
      context: .
      dockerfile: devops/Dockerfile.simulator
    image: telematics/trip-simulator:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark:
        condition: service_started
    command: ["--bootstrap", "kafka:9092", "--drivers", "5", "--trips", "3", "--speed", "0.3"]
    restart: unless-stopped
    networks:
      - telematics-net

  risk-api:
    build: ./risk_api
    image: telematics/risk-api:local
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: telematics-org
      INFLUXDB_BUCKET: telematics
      # Local-dev token created by the influxdb service above. Override it by
      # exporting INFLUXDB_TOKEN before `docker compose up`.
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-telematics-dev-token}
    ports:
      - "8001:8000"
    networks:
      - telematics-net

volumes:
  influxdb-data:
  grafana-data:
  spark-ivy:
