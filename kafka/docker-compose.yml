# kafka/docker-compose.yml
#
# Local Kafka cluster for the telematics platform. Uses Confluent's
# Zookeeper-backed Kafka images (7.5.0) rather than KRaft mode, because the
# Confluent 7.5.0 images have the most battle-tested Zookeeper docs/tooling
# for a learning project like this one.
#
# Two listeners are configured on the broker on purpose:
#   - kafka:9092      -> used by OTHER CONTAINERS (Spark, simulator when
#                         containerised) via the Docker-internal network.
#   - localhost:29092 -> used by tools running on the HOST machine (e.g. you
#                         running kafka_producer.py directly from a terminal
#                         during development, or Kafka UI's browser calls).
#
# Without this dual-listener setup, clients on the host cannot resolve the
# `kafka` hostname and clients inside Docker cannot use `localhost` -- a
# very common Kafka-in-Docker pitfall.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: telematics-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      # A plain TCP connectivity check rather than the `ruok` four-letter
      # word: `ruok` is disabled by default from ZooKeeper 3.5+ onward for
      # security reasons and re-enabling it requires config this image's
      # generic env-var mapper doesn't expose, so a TCP check is the more
      # portable choice here.
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telematics-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: telematics-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Exposes the host listener so tools on the host machine can connect
      # via localhost:29092.
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners, two advertised addresses -- see the block comment
      # above for why both exist.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-create the vehicle.trip.events topic on first publish so the
      # simulator doesn't need a separate topic-provisioning step.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - telematics-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: telematics-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: telematics-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - telematics-net

networks:
  telematics-net:
    name: telematics-net
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
